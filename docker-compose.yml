version: "3.8"
services:
  fitness_api:
    build:
      context: .
    container_name: fitness_api
    restart: unless-stopped
    networks:
      - fitness-tracker_fitness_network
    environment:
      PGHOST: fitness_db
      PGPORT: 5432
      PGUSER: fitness
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: fitness
    ports:
      - "8082:3000"

networks:
  fitness-tracker_fitness_network:
    external: true